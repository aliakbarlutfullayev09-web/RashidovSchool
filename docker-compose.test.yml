services:
  postgres:
    image: postgres:16-alpine
    container_name: rashidov_test_pg
    environment:
      POSTGRES_DB: rashidov_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rashidov_test"]
      interval: 3s
      timeout: 3s
      retries: 10

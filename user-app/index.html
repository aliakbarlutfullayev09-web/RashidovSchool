<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="description" content="Biologiya fanidan interaktiv video darslar, testlar, kundalik topshiriqlar va o'quvchilar reytingi platformasi." />
    <meta property="og:title" content="Rashidov Biologiya LMS" />
    <meta property="og:description" content="Biologiya fanidan interaktiv video darslar, testlar, kundalik topshiriqlar va o'quvchilar reytingi platformasi." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          const webApp = window.Telegram?.WebApp;
          webApp?.ready();
          webApp?.expand();

          if (
            webApp &&
            webApp.isVersionAtLeast?.('8.0') &&
            typeof webApp.requestFullscreen === 'function'
          ) {
            webApp.requestFullscreen().catch(function() {});
          }
        } catch (e) {
          console.warn('Early Telegram WebApp bootstrap error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
